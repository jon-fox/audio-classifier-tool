[project]
name = "audioclassifier"
version = "1.1.0"
description = "Dynamic Classifier and Audio Removal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "backoff>=2.2.1",
    "boto3>=1.40.21",
    "ctranslate2==4.8.2",
    "faster-whisper==1.2.1",
    "numpy>=2",
    # cuBLAS + cuDNN 9 for ctranslate2 GPU inference (previously bundled via torch/apt)
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'linux'",
    "openai>=2",
    "pydantic>=2.11.7",
    "pydantic-ai-slim[openai]>=2",
    "python-toon>=0.1.3",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
]

[project.scripts]
audioclassifier = "audioclassifier.cli:main"

[tool.pytest.ini_options]
markers = ["integration: full episode run; needs OPENAI_API_KEY and network"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audioclassifier"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
