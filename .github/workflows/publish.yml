name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Install
      run: uv sync

    - name: Unit tests
      run: uv run pytest

    - name: Build
      run: uv build

    - name: Publish
      run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
